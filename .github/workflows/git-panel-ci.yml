name: Git Panel CI
'on':
  push:
    branches:
      - master
      - main
  pull_request: {}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # **超时**（2026-10-14 加）：实测到一次卡死——run 1791966652 的 "Format check" 成功后整条 run
    # 再没推进（最终被面板标为 interrupted），期间后面的 run 全部排队等待，队列里还留下一条
    # 永不被调度的孤儿条目（run 1791966932，`steps: []`、日志 412 B）。加超时后单条 run 最迟
    # 30 分钟结束，不会无限期占住执行槽。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Format check (rustfmt, nightly)
        run: rustup run nightly cargo fmt --all -- --check
      - name: Build release (nightly, +lasx)
        run: cargo +nightly build --workspace --release
      - name: Test release
        run: cargo +nightly test --workspace --release
      - name: Clippy (zero warnings guard)
        run: cargo +nightly clippy --workspace --all-targets -- -D warnings
      # **rustdoc 零告警**（2026-10-14 加）：README 记录了这条命令，而它此前**不在 CI 里** ⇒
      # 一次注释重写把说明改成 intra-doc link `` [`crate::ops`] ``（私有项）后，`cargo doc -D warnings`
      # 变红而 build/test/clippy 全绿——这类回归只能由 rustdoc 自己抓到（实测：全工作区几秒）。
      - name: Rustdoc (zero warnings guard)
        run: RUSTDOCFLAGS="-D warnings" cargo +nightly doc --no-deps --workspace
      # **ABI 门禁**（2026-10-15 加）：对外实际分发的是 **cdylib**，而 `doccheck` ③ 比的是
      # "**源码里 `pub extern "C" fn lasx_*` 的个数**"——若某个符号被改名、漏 `#[no_mangle]`、
      # 或被链接器丢掉，**源码计数仍然一致**，只有数**产物**才抓得到。故这里直接数 `.so` 的
      # 动态符号表，并与 `docs/ops.md` §1 记录的导出符号数对比。
      - name: ABI symbol count (cdylib vs documented)
        run: |
          so=target/release/liblasx_rs.so
          n=$(nm -D "$so" | grep -c ' T lasx_')
          d=$(grep -oE '[0-9]+ 个导出符号' docs/ops.md | head -1 | grep -oE '[0-9]+')
          echo "cdylib 导出 lasx_* = $n；docs/ops.md §1 记 = $d"
          [ "$n" = "$d" ] || { echo "::error::ABI 导出符号数与文档不一致"; exit 1; }
      # **逐符号原型校验**（2026-10-15 加）：上面的门禁只数**个数**，抓不到"原型漂移/参数次序错/
      # 少一个 `_checked` 变体"。`scripts/check_header.c` 把 83 个符号地址放进数组（编译期钉住个数）
      # 并逐个实调 41 个 `_checked`（断言 status 位置与取值域），另含融合缩放的行为断言。
      # 用**静态**链接（不依赖本地 SONAME 符号链接，runner 上更稳）。
      - name: C header vs ABI (per-symbol link + behaviour)
        run: |
          gcc -O2 -Iinclude scripts/check_header.c target/release/liblasx_rs.a \
              -lm -lpthread -ldl -o /tmp/check_header
          /tmp/check_header
      # **文档计数 vs 实测**（2026-10-15 加）：文档里记的库单测数曾漂成 218/220 而实测 226
      # （`docs/dev.md §4` 的增量清单自身也只加得出 ~214）⇒ 与上面两条同思路：
      # **文档承诺 vs 产物实测**。口径：4 处必须给出**同一个**数，且等于 `--list` 实测值。
      # 历史决策记录里的 "N 单测" 写法（如 `217 → 218`）不在匹配范围，故意不纳入。
      - name: Documented test count vs measured
        run: |
          d=$(grep -ohE '[0-9]+ 个单元测试|[0-9]+ unit tests' docs/dev.md README.md README.en.md \
              | grep -oE '[0-9]+' | sort -u)
          n=$(cargo +nightly test --release --lib -- --list | grep -c ': test$')
          echo "文档记：$(echo "$d" | tr '\n' ' ')；实测库单测：$n"
          if [ "$(printf '%s\n' "$d" | wc -l)" != "1" ] || [ "$d" != "$n" ]; then
            echo "::error::文档单测计数与实测不一致（或多处不一致）"; exit 1
          fi
