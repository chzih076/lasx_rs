name: Git Panel CI
'on':
  push:
    branches:
      - master
      - main
  pull_request: {}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # **超时**（2026-10-14 加）：实测到一次卡死——run 1791966652 的 "Format check" 成功后整条 run
    # 再没推进（最终被面板标为 interrupted），期间后面的 run 全部排队等待，队列里还留下一条
    # 永不被调度的孤儿条目（run 1791966932，`steps: []`、日志 412 B）。加超时后单条 run 最迟
    # 30 分钟结束，不会无限期占住执行槽。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Format check (rustfmt, nightly)
        run: rustup run nightly cargo fmt --all -- --check
      - name: Build release (nightly, +lasx)
        run: cargo +nightly build --workspace --release
      - name: Test release
        run: cargo +nightly test --workspace --release
      - name: Clippy (zero warnings guard)
        run: cargo +nightly clippy --workspace --all-targets -- -D warnings
      # **rustdoc 零告警**（2026-10-14 加）：README 记录了这条命令，而它此前**不在 CI 里** ⇒
      # 一次注释重写把说明改成 intra-doc link `` [`crate::ops`] ``（私有项）后，`cargo doc -D warnings`
      # 变红而 build/test/clippy 全绿——这类回归只能由 rustdoc 自己抓到（实测：全工作区几秒）。
      - name: Rustdoc (zero warnings guard)
        run: RUSTDOCFLAGS="-D warnings" cargo +nightly doc --no-deps --workspace
      # **ABI 门禁**（2026-10-15 加）：对外实际分发的是 **cdylib**，而 `doccheck` ③ 比的是
      # "**源码里 `pub extern "C" fn lasx_*` 的个数**"——若某个符号被改名、漏 `#[no_mangle]`、
      # 或被链接器丢掉，**源码计数仍然一致**，只有数**产物**才抓得到。故这里直接数 `.so` 的
      # 动态符号表，并与 `docs/ops.md` §1 记录的导出符号数对比。
      - name: ABI symbol count (cdylib vs documented)
        run: |
          so=target/release/liblasx_rs.so
          n=$(nm -D "$so" | grep -c ' T lasx_')
          # 数据源**不再写死 ops.md**：C ABI 权威已搬到 `docs/c-abi.md`，而计数若散在多处就会漂
          # （本会话已有 81 vs 83、218/220 vs 226 两次）。故改为**扫全部文档**，要求
          # 「只出现一个值」且等于 `.so` 实测值 —— 单源与"残留旧数即红"同时成立。
          d=$(grep -ohE '[0-9]+ 个导出符号|[0-9]+ exported symbols' docs/*.md README.md README.en.md \
              | grep -oE '[0-9]+' | sort -u | tr '\n' ' ' | xargs)
          echo "cdylib 导出 lasx_* = $n；文档记 = [${d:-<无>}]"
          case "$d" in
            "$n") echo "OK：ABI 符号数与文档一致（$n）" ;;
            *) echo "::error::文档里的导出符号数 [$d] 与 cdylib 实测 [$n] 不一致（或出现了多个值）"; exit 1 ;;
          esac
      # **逐符号原型校验**（2026-10-15 加）：上面的门禁只数**个数**，抓不到"原型漂移/参数次序错/
      # 少一个 `_checked` 变体"。`scripts/check_header.c` 把 83 个符号地址放进数组（编译期钉住个数）
      # 并逐个实调 41 个 `_checked`（断言 status 位置与取值域），另含融合缩放的行为断言。
      # 用**静态**链接（不依赖本地 SONAME 符号链接，runner 上更稳）。
      - name: C header vs ABI (per-symbol link + behaviour)
        run: |
          gcc -O2 -Iinclude scripts/check_header.c target/release/liblasx_rs.a \
              -lm -lpthread -ldl -o /tmp/check_header
          /tmp/check_header
      # **C ABI 命名规范**（2026-10-15 加）：与上面三条同思路——**规范必须由机器守**。
      # 校验 `.so`/`.a` 的**动态符号表**与 `src/ffi/*.rs`：形态 `lasx_<domain>_<op>[_<qualifier>]`、
      # 尾部后缀只允许 `_checked`、`_checked` 必有同名裸孪生、库级符号只能来自 5 个白名单。
      # 规则与自查清单见 `docs/c-abi.md` §9.1。退出码 2（环境/用法问题）按失败处理。
      - name: C ABI naming convention
        run: bash scripts/namecheck.sh
      # **剖析装置不许腐烂**（2026-10-15 加）：`scripts/profile_lasx.sh` 是 perf 剖析的唯一入口，
      # 但它只能在**真机 + 用户态权限**下跑（本机 `perf_event_paranoid=2`；uncore/内核帧还要更低）。
      # CI **不跑 perf**（runner 上多半没权限，计数也不可当正式数），只做两件便宜事：
      # **语法可解析** + **用法自述存在** —— 避免"到真正要剖析时才发现脚本被改坏"。
      - name: Profiling harness sanity (syntax + usage)
        run: |
          bash -n scripts/profile_lasx.sh
          grep -q '用法' scripts/profile_lasx.sh
      # **实战示例的"运行"覆盖**（2026-10-15 加）：Rust 实战示例（DSL 拉普拉斯变换）的**编译**
      # 已由 `cargo test --workspace` 覆盖（cargo 会编译 examples），这里补**运行**——
      # 它同时是"DSL 默认走的自动策略已跟上"的**可执行证据**：输出里带解析对照、加密收敛
      # （梯形 O(Δt²)）、同进程性能，并在 example 内断言与 `api::matmul` **逐位一致**。
      - name: Run Rust example (Laplace via DSL)
        run: cargo run --release --example laplace
      # **跨库对照装置必须能编译**（2026-10-15 加）：`scripts/bench_openblas.c` 是对外对照的**唯一
      # 可复现装置**（旧 §7.10 的数字曾因"驱动不在仓库里"而无法复现、只能标历史）。CI **不跑计时**
      # （计时需要安静窗口，见 `docs/dev.md` §6.4 的 A/B/C 分级），只保证**装置不腐烂**：
      # 静态链 `liblasx_rs.a`（免得踩 SONAME 符号链接）+ `pkg-config` 取 OpenBLAS。
      - name: Cross-library harness compiles (OpenBLAS)
        run: |
          gcc -O2 -Wall -Wextra -Werror -Iinclude scripts/bench_openblas.c \
              target/release/liblasx_rs.a $(pkg-config --cflags --libs openblas) \
              -lm -lpthread -ldl -o /tmp/bench_openblas_ci
          /tmp/bench_openblas_ci --impl=both --dtype=f32 --m=64 --k=64 --n=64 --threads=1 >/dev/null
      # **文档计数 vs 实测**（2026-10-15 加）：文档里记的库单测数曾漂成 218/220 而实测 226
      # （`docs/dev.md §4` 的增量清单自身也只加得出 ~214）⇒ 与上面两条同思路：
      # **文档承诺 vs 产物实测**。口径：4 处必须给出**同一个**数，且等于 `--list` 实测值。
      # 历史决策记录里的 "N 单测" 写法（如 `217 → 218`）不在匹配范围，故意不纳入。
      - name: Documented test count vs measured
        run: |
          d=$(grep -ohE '[0-9]+ 个单元测试|[0-9]+ unit tests' docs/dev.md README.md README.en.md \
              | grep -oE '[0-9]+' | sort -u | tr '\n' ' ' | xargs)
          set +e
          n=$(cargo +nightly test --release --lib -- --list 2>/dev/null | grep -c ': test$')
          rc=$?
          set -e
          echo "文档记：[${d:-<无>}]；实测库单测：[${n:-<无输出>}]（--list rc=$rc）"
          # **量不出来 ≠ 不一致**：`--list` 若没产出（例如该环境拿不到测试二进制），只告警不红，
          # 免得"测量工具失效"被误当成"文档漂移"；**真的不一致仍然 fail**。
          if [ -z "$n" ] || [ "$n" = "0" ]; then
            echo "::warning::--list 无输出，本步跳过比对（未把它当作漂移）"
            exit 0
          fi
          case "$d" in
            "$n") echo "OK：文档与实测一致（$n 个单元测试）" ;;
            *) echo "::error::文档单测计数 [$d] 与实测 [$n] 不一致"; exit 1 ;;
          esac
      # **C 调用示例**（2026-10-15 加）：把 `examples/c/` 真编译**并运行**——它是"调用体验"的
      # 可执行证据（查版本 → 查 `lasx_has_lasx()` 并分支 → 调算子 → 用 `lasx_status_message`
      # 打印状态）。CI 里没有安装前缀，所以用 `FALLBACK=1` 直接链接 `target/release`。
      - name: C example (compile + run)
        run: |
          make -C examples/c FALLBACK=1
          ./examples/c/quickstart
          # 多核用法两种：调用方线程 + 计划复用（`plan`）、便利层（`run_threaded`）。
          # 两者都**自验位精确**并**打印实际线程数** —— 后者的意义是防"静默退化成串行"
          # （`rows` 那个 1.08× 扩展比就是静默退化的典型）。
          ./examples/c/matmul_mt_caller
          ./examples/c/matmul_mt_convenience
