[workspace]
members = ["cli", "macros", "yll"]

[package]
name = "lasx_rs"
version = "0.1.0"
edition = "2024"
description = "lasx_rs 是为龙芯平台推出的向量库，支持调用龙芯架构里面的 LASX（256 位）与 LSX（128 位）向量指令集"
license = "MIT"
repository = "https://github.com/chzih076/lasx_rs"
readme = "README.md"
keywords = ["loongarch", "lasx", "lsx", "simd", "numerics"]
categories = ["hardware-support", "mathematics", "science"]
# 只收录要发出去的东西：文档/基准/脚本/下游样板都不进 crate（`docs/` 有 250 KB+）。
# `/examples`：实测（`cargo package --no-verify --list`）它会带进 **13 个文件**，而里面是
# **机器相关的微内核探针与 A/B 台架**（`kernel_probe`、`matmul_ab` 等），不是给用户看的用法示例
# ——README 里那些 `cargo run --example …` 的说明指向的是**源码仓库**。
exclude = ["/docs", "/scripts", "/cli", "/yll", "/examples", "/AGENTS.md"]

[lib]
# 三种产物，各自有明确消费者：
# - `rlib`：Rust 侧依赖（`lasx_rs = "0.1"` 走这个，cargo 默认会选它）；
# - `cdylib`：C/其它语言用的动态库（SONAME 由 `build.rs` 固定为 `liblasx_rs.so.0`）；
# - `staticlib`：不想带 `.so` 的 C 消费者静态链接（`liblasx_rs.a`）。
# 三者的数值实现是同一份代码，不存在"动态库版与静态库版结果不同"。
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# 公式 DSL 的宏实现：零第三方依赖（手写 TokenStream）。
# `version` 供发布后从 crates.io 解析；`path` 供本地开发（cargo 发布时会去掉 path 字段，
# 见 `docs/dev.md` §22.2）。
lasx_rs_macros = { path = "macros", version = "0.1.0" }
# **可选**：`simd_dsl` 的 `Backend` 实现（③a）。**默认不启用** ⇒ 无 feature 时 cargo 不解析该依赖、
# 不编译 `src/dsl_backend.rs`，默认构建逐字节不变。依赖方向 **`lasx_rs → simd_dsl` 单向**。
#
# ⚠️ **流程规则（③b-3c 记）**：这里的 `rev` 是**钉死的**。**引擎（`simd_dsl`）一移动，就必须显式 bump 本行**
# （`git ls-remote <panel>` 取实值），否则本仓看到的是**旧快照**——③b-3b 就是因为 rev 钉在 `fc57fc7`
# 而误判"`IdiomaticBackend` 未导出"（实际 `521e837` 已 `pub use idiomatic::IdiomaticBackend;`）。
# 改完必须 `cargo update -p simd_dsl` 让 `Cargo.lock` 跟上。
simd_dsl = { git = "http://192.168.1.64/api/git/simd_dsl.git", rev = "b4a1db786cfd2df31ce7b5366885c34cac8abd0b", optional = true }
# **可选**：`ops_dsl`（算子库，含谱检测整帧 `detect`）——**只给"帧级 A/B"示例用**。
# 依赖方向仍向下：`lasx_rs → ops_dsl → simd_dsl`；与 `simd_dsl` 同一个 rev（同一 git 仓的 workspace 成员）。
# 仅在本 feature 下解析 ⇒ 默认构建不受影响（同上：一移动就 bump、并 `cargo update -p ops_dsl`）。
ops_dsl = { git = "http://192.168.1.64/api/git/simd_dsl.git", rev = "b4a1db786cfd2df31ce7b5366885c34cac8abd0b", optional = true }

[features]
# 把 `lasx_rs` 的 LASX 内核接成 `simd_dsl::Backend`（见 `src/dsl_backend.rs`）。
# **默认关**：`cargo build` / `cargo test` / CI 十三步都不受影响。
dsl-backend = ["dep:simd_dsl", "dep:ops_dsl"]

# **conformance harness（task-80）**：`simd_dsl` 的 `conformance` feature 只在测试构建启用
# （与上面的 `[dependencies]` 是同一个包、同一个 rev；dev-dependency 只是给测试 crate 打开 feature）。
# 这样默认/生产构建不会把 harness 编进来。
[dev-dependencies]
simd_dsl = { git = "http://192.168.1.64/api/git/simd_dsl.git", rev = "b4a1db786cfd2df31ce7b5366885c34cac8abd0b", features = ["conformance"] }

# `tests/conformance.rs`：1 行 `backend_conformance!(LasxBackend)` ⇒ 16 个通用测试 / 15 组。
# 依赖 `dsl-backend`（`LasxBackend` 在该 feature 下才编译）。
[[test]]
name = "conformance"
required-features = ["dsl-backend"]

# `dsl_efficiency` 需要可选依赖 `simd_dsl` ⇒ **只在开 `dsl-backend` 时才构建**；
# 默认 `cargo build --all-targets` / CI 十三步不会碰到它（否则示例空 `main` 会报 E0601）。
[[example]]
name = "dsl_efficiency"
required-features = ["dsl-backend"]

# `lasx_vs_portable`（R6-B-3）：三档后端横向对比（手写 SIMD vs 可移植优化档 vs 下限臂）
# ——同样需要 `simd_dsl` ⇒ **只在开 `dsl-backend` 时构建**，默认构建不碰它。
[[example]]
name = "lasx_vs_portable"
required-features = ["dsl-backend"]

# `spectral_frame_ab`（R19-D）：**谱检测整帧**在 LASX 档上的 A/B（`DftMode::Direct` vs `Auto`=FFT）
# ——需要 `ops_dsl`（整帧 `detect`）⇒ 同样只在开 `dsl-backend` 时构建。
[[example]]
name = "spectral_frame_ab"
required-features = ["dsl-backend"]

# `dsl_perf_report`（R19-F）：完整性能报表（LASX / 可移植 / 抽象层损失）
[[example]]
name = "dsl_perf_report"
required-features = ["dsl-backend"]

# `migrate_ab`（IS-9，阶段3 批1）：**迁移 A/B 统一装置**——旧 `api::*` vs `ops_dsl::*`（经 `LasxBackend`）
# 同进程交替 ≥5 轮丢首轮取中位，并打印 `threads`/`work`/`loadavg`；另含 IS-1/IS-2 的"接线前后"对照。
# 需要 `simd_dsl`/`ops_dsl` ⇒ 只在开 `dsl-backend` 时构建（默认档不碰）。
[[example]]
name = "migrate_ab"
required-features = ["dsl-backend"]

# `fused_ab`（阶段4）：**融合原语 override vs api 直调**的 A/B（`supports(Fused*)` 为真才加速）。
[[example]]
name = "fused_ab"
required-features = ["dsl-backend"]

# `auto_ab` / `composed_ab` / `geomf64_auto_ab` **已随算子命名收尾（2026-10-19）删除**：
# 这三个 example 的 B 臂依赖 `ops_dsl` 已删除的 `*_auto` / `*_composed` 实现策略后缀（用户口径：
# 一个算子一个公开名、不暴露实现策略）。它们的历史数据仍入册 `docs/dev.md` §7.32.1/§7.32.4/§7.47，
# 但**不可再从 HEAD 复现**；新的"融合 vs 组合"口径见 `simd_dsl/docs/operator_audit.md` §9（ROI 表）。

# `geomf64_ab`（阶段4 收尾）：**f64 几何五入口** A/B——A = `api::*_into`（LASX 向量核），
# B = `ops_dsl::geometry::*_f64(&LasxBackend, …)`（组合版源实现；f64 契约六方法拼出来）。
# 同进程交替 ≥5 对丢首对取中位、先等价类再谈性能；**预期组合版全部 BelowThreshold**
# （LASX 没有 f64 逐元素 override）——如实记录，不硬造"不输"。
# ⚠️ 依赖 `ops_dsl` 的几何 f64 入口（`simd_dsl` 仓 `geomf64` 分支，`ops_dsl` 提交 `f525549`）；
# **合入前 `--features dsl-backend` 档编译不过**（rev 还是 `9069ff1`）⇒ 与 rev bump 同批合入。
[[example]]
name = "geomf64_ab"
required-features = ["dsl-backend"]

# B1/task-106（M5）：组合原语 override 的 A/B（受控线程 `pool::init_global(1|12)`；只用
# `dsl-backend` 面：`LasxBackend.axpy_inplace_f32` vs `ScalarBackend` 默认实现）。
[[example]]
name = "prims_ab"
required-features = ["dsl-backend"]

# `geomf64_fused_ab` **已随批2 删除**：5 个几何具名方法（`Backend::*_f64`）在 `b89a32f` 被
# `FusedPlan` 取代 ⇒ 原「trait override vs api」装置不再有对照臂；几何 A/B 现由 `plan_ab`
# 的 5 条 Plan 行承接（Plan vs 直接 api）。


# `row_par_ab`（路线图 P0-3）：**行归约/归一化自动并行**的 A/B——同进程 `WorkerPool::new(1)` vs
# `WorkerPool::auto()`（切分层接收显式池，绕开 `pool::global()` 单例）；先逐位等价再谈 ≥10% 采纳。
[[example]]
name = "row_par_ab"
required-features = ["dsl-backend"]

# `map_rowsum_ab`（P0-2）：**单趟 map+行和 override vs portable** A/B——
# A = `simd_dsl::kernels::scalar::map_rows_sum_f32`（默认实现），B = `LasxBackend::map_rows_sum_f32`
# （LASX `exp_vec` 单趟向量化 + per-lane 行和）。≥10% 才保留 override；映射值/行和都给实测界。
[[example]]
name = "map_rowsum_ab"
required-features = ["dsl-backend"]

# `f64_map_ab`（P1-4）：**LASX f64 逐元素 override vs portable 默认** A/B——
# A = `simd_dsl::kernels::scalar::{map_binary,map_ternary,map_affine}_f64`（契约默认实现），
# B = `LasxBackend::{...}_f64`（本仓 `ops::f64_map` 的 LASX 4×f64 向量内核）。
# 同进程交替 6 对丢首对中位、n = 1M/8M、先逐位再谈倍率；目标 ≥2×，不足如实记。
[[example]]
name = "f64_map_ab"
required-features = ["dsl-backend"]

# `quant_i8_ab`（P1-5）：**i8 量化族 override vs portable 默认** A/B——
# A = `simd_dsl::kernels::scalar::{quantize_i8_rows_f32,dot_i8,gemv_i8}`，
# B = `LasxBackend` 的同名 override（`ops::quant_i8`/`ops::dot_i8`/`ops::gemv_i8` 内核）。
# 同进程交替 6 对丢首对中位；先逐位再谈倍率，**≥1.10× 才保留该 override**。
[[example]]
name = "quant_i8_ab"
required-features = ["dsl-backend"]

# `plan_ab`（task-63）：**Plan 路径（`exec_fused_plan`）vs 命名方法 vs 直接 api** A/B——
# A = `LasxBackend::exec_fused_plan`（override → LASX 融合核），B = 命名方法（`axpy_f32`/
# `softmax_rows_f32`，同一内核），C = `api::axpy`/`api::softmax_rows_into` 直调。
# 同进程交替 6 对丢首对中位；A≡B≡C 逐位；**B/A、C/A ≥0.98** 才算 Plan 路径不掉性能。
[[example]]
name = "plan_ab"
required-features = ["dsl-backend"]

# `dsl_vs_lasx_ab`（task-126，性能比赛测试台第一批）：**DSL 算子 vs LASX 库算子**——
# A = `lasx_rs::api::*`（手写 LASX 内核），B = `ops_dsl::*`（DSL 宏算子 + `LasxBackend`）。
# 一个进程只跑一个臂/一个 threads（`SIMD_DSL_ENGINE_THREADS` 引擎只读一次）；进程级交替由
# `scripts/dsl_vs_lasx_ab.sh` 做（≥5 轮丢首轮、中位+极差、同时打印等价类与 loadavg）。
# 覆盖：matmul 1024³ / dot / sum / softmax_rows / rms_norm / layer_norm / gelu_quick / axpy /
# absmax_rows / cmatmul（Direct 路线）；`sum_cols`/`sum_rows`/`weighted_sum_cols` 因 LASX 无公开
# `api::*` 入口**本轮不测**（如实写在 example 文件头）。
[[example]]
name = "dsl_vs_lasx_ab"
required-features = ["dsl-backend"]

# `dsl_vs_lasx_ab2`（性能比赛·第二批，收窄版）：几何 f64 的 A/B（LASX `api::*_batch_into` ↔
# `ops_dsl::geometry::*_f64`）。仅覆盖**两边都有、同 dtype 同语义**的 `norm3`/`unitize3`；
# `vec3_add_scaled`/`cross3`（DSL 侧带额外暂存参数未读全）、spectral/stencil（LASX 无公开入口）、
# 几何 f32（LASX 仅 f64 版本）均**如实跳过**（见 example 文件头）。
[[example]]
name = "dsl_vs_lasx_ab2"
required-features = ["dsl-backend"]

