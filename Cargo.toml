[workspace]
members = ["cli", "macros", "yll"]

[package]
name = "lasx_rs"
version = "0.1.0"
edition = "2024"
description = "lasx_rs 是为龙芯平台推出的向量库，支持调用龙芯架构里面的 LASX（256 位）与 LSX（128 位）向量指令集"
license = "MIT"
repository = "https://github.com/chzih076/lasx_rs"
readme = "README.md"
keywords = ["loongarch", "lasx", "lsx", "simd", "numerics"]
categories = ["hardware-support", "mathematics", "science"]
# 只收录要发出去的东西：文档/基准/脚本/下游样板都不进 crate（`docs/` 有 250 KB+）。
# `/examples`：实测（`cargo package --no-verify --list`）它会带进 **13 个文件**，而里面是
# **机器相关的微内核探针与 A/B 台架**（`kernel_probe`、`matmul_ab` 等），不是给用户看的用法示例
# ——README 里那些 `cargo run --example …` 的说明指向的是**源码仓库**。
exclude = ["/docs", "/scripts", "/cli", "/yll", "/examples", "/AGENTS.md"]

[lib]
# 三种产物，各自有明确消费者：
# - `rlib`：Rust 侧依赖（`lasx_rs = "0.1"` 走这个，cargo 默认会选它）；
# - `cdylib`：C/其它语言用的动态库（SONAME 由 `build.rs` 固定为 `liblasx_rs.so.0`）；
# - `staticlib`：不想带 `.so` 的 C 消费者静态链接（`liblasx_rs.a`）。
# 三者的数值实现是同一份代码，不存在"动态库版与静态库版结果不同"。
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# 公式 DSL 的宏实现：零第三方依赖（手写 TokenStream）。
# `version` 供发布后从 crates.io 解析；`path` 供本地开发（cargo 发布时会去掉 path 字段，
# 见 `docs/dev.md` §22.2）。
lasx_rs_macros = { path = "macros", version = "0.1.0" }

# **纯化（2026-10-23）**：本 crate 不再依赖任何 DSL/simd crate——依赖方向翻转为
# **DSL 仓 → lasx**。原先的 `dsl-backend` feature、`simd_dsl`/`ops_dsl`/`attention_block`
# 可选依赖与全部 DSL 示例/测试已移除；对外内核通过 `pub mod ops` + `ops::types` 的中性 API 暴露，
# 适配器在 DSL 仓实现。
