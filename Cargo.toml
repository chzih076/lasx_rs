[workspace]
members = ["cli", "macros", "yll"]

[package]
name = "lasx_rs"
version = "0.1.0"
edition = "2021"
description = "lasx_rs 是为龙芯平台推出的向量库，支持调用龙芯架构里面的 LASX（256 位）与 LSX（128 位）向量指令集"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 公式 DSL 的宏实现：内部 crate、不发布、零第三方依赖（手写 TokenStream）
lasx_rs_macros = { path = "macros" }
